<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sag Calculator</title>
  <meta name="description" content="Free motorcycle suspension sag calculator. Works out your rider sag and free sag targets and logs your readings as you adjust preload.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5bd8'/%3E%3Cpath d='M9 7h14M9 25h14M11 7l10 3-10 3 10 3-10 3 10 3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Sag Calculator</h1>
        <p class="sub">Rear first, then front. Everything saves on this device.</p>
      </div>
      <div class="units" role="group" aria-label="Units for tape readings and results">
        <button type="button" data-act="unit" data-unit="mm" aria-pressed="true">mm</button>
        <button type="button" data-act="unit" data-unit="in" aria-pressed="false">in</button>
      </div>
    </header>

    <p id="storage-warn" class="banner" hidden>Your browser is blocking storage, so these numbers won't be kept after you close the page.</p>

    <section class="card bike" aria-label="Bike">
      <label class="field">
        <span class="lbl">Bike name</span>
        <input id="bike-name" class="text" type="text" placeholder="e.g. Ténéré 700" maxlength="60" autocomplete="off">
      </label>
      <div class="bike-row">
        <label class="field grow">
          <span class="lbl">Saved bikes</span>
          <select id="bike-select"></select>
        </label>
        <button class="btn" type="button" data-act="new-bike">+ New bike</button>
      </div>
      <div id="bike-del" class="bike-del"></div>
    </section>

    <nav class="jump" aria-label="Jump to section">
      <a href="#sec-rear"><span class="step">1</span> Rear</a>
      <a href="#sec-front"><span class="step">2</span> Front</a>
    </nav>

    <div id="sections"></div>

    <footer class="foot">
      <p>Made by <a href="https://www.youtube.com/@BR-ADV" target="_blank" rel="noopener">BackroadADV</a> · <a href="https://www.youtube.com/@BR-ADV" target="_blank" rel="noopener">YouTube @BR-ADV</a></p>
      <p>Starting ranges, not laws. Your owner's manual number wins.</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
